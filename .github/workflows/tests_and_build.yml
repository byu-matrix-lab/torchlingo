name: Test, Build, and Publish Python package

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      # Tutorials live here and are executed by the `notebooks` job. Without
      # this path, a notebook change triggers no workflow at all.
      - 'docs/**'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - '.pre-commit-config.yaml'
      - '.github/workflows/tests_and_build.yml'
    tags: ['v*']
  # Deliberately not filtered by base branch. A PR stacked behind another PR
  # targets that PR's branch rather than main, and a `branches: [main]` filter
  # here means it runs no checks at all. The reviewer then sees an empty check
  # list and cannot tell "not run" from "not passing", which is the state the
  # PR is actually reviewed in: CI would only start after it is retargeted to
  # main, which happens after review. Retargeting does not help either, since
  # that is not a `pull_request` event.
  #
  # The `push` trigger above keeps its `branches: [main]`, which is what stops
  # every branch push from burning a duplicate run.
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      # Tutorials live here and are executed by the `notebooks` job. Without
      # this path, a notebook change triggers no workflow at all.
      - 'docs/**'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - '.pre-commit-config.yaml'
      - '.github/workflows/tests_and_build.yml'
  workflow_dispatch: {}

jobs:
  lint:
    name: Lint and format check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Read the pinned ruff spec straight out of pyproject.toml so this
      # workflow cannot drift from the dev extra or from
      # .pre-commit-config.yaml. Ruff's default rule set widens across
      # releases, so a version mismatch changes what "clean" means.
      - name: Install pinned ruff
        run: |
          python -m pip install --upgrade pip
          RUFF_SPEC=$(python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              dev = tomllib.load(f)['project']['optional-dependencies']['dev']
          print(next(d for d in dev if d.startswith('ruff')))
          ")
          echo "Installing $RUFF_SPEC"
          pip install "$RUFF_SPEC"

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

  tests:
    name: Run tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install project with dev+asian extras
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu ".[dev,asian]"

      - name: Create SentencePiece test models
        run: |
          python scripts/generate_sentencepiece_models.py --example data/example.tsv --n 2000

      - name: Run test suite
        run: |
          python -m pytest tests/

      # Docstring examples are the code students are most likely to copy, and
      # nothing executed them until now: 30 of the 48 in the package were
      # broken, including one that printed a BLEU score the code does not
      # produce. Fixing them without running them would just reset the clock.
      #
      # Examples that genuinely cannot run here -- they need a trained model, a
      # corpus on disk, or an optional extra -- carry an explicit
      # `# doctest: +SKIP`. That is a visible decision rather than a silent
      # failure.
      - name: Run docstring examples
        run: |
          python -m pytest --doctest-modules src/torchlingo

  notebooks:
    name: Execute tutorial notebooks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install project and notebook tooling
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu ".[dev]"
          pip install nbconvert ipykernel

      # The docs site does not run these: mkdocs-jupyter is configured with
      # execute: false and allow_errors: true, so a tutorial can rot completely
      # and neither the build nor a reader will notice. Tutorial 2 once shipped
      # emitting empty translations for every phrase, and tutorial 3 raised
      # NameError on a clean run. This job is the check that was missing.
      - name: Execute notebooks
        run: |
          python scripts/execute_notebooks.py

  docs:
    name: Build docs strictly
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      # Read the `docs` extra out of pyproject.toml rather than restating the
      # package list, the same way the lint job reads its pinned ruff spec.
      # Two hand-written copies of one dependency list drift; this cannot.
      #
      # Deliberately NOT `pip install ".[docs]"`, which would also install the
      # project and therefore torch. The docs build never imports torchlingo --
      # mkdocstrings reads the source statically via griffe -- so pulling a
      # ~200 MB wheel into this job would buy nothing.
      - name: Install docs tooling
        run: |
          python -m pip install --upgrade pip
          DOCS_SPECS=$(python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              extras = tomllib.load(f)['project']['optional-dependencies']
          print(' '.join(extras['docs']))
          ")
          echo "Installing $DOCS_SPECS"
          pip install $DOCS_SPECS

      # `--strict` turns MkDocs warnings into a failure. Without it a link to a
      # page that does not exist is a line in a log nobody reads, and the site
      # publishes with the link broken -- which is how four of them accumulated.
      # The deploy workflow builds the same site, so a failure here is a failure
      # that would otherwise have shipped.
      #
      # This does not execute notebooks: mkdocs-jupyter is configured with
      # execute: false, so the job is fast and needs no data. Tutorials are
      # executed by the `notebooks` job instead.
      - name: Build docs
        run: mkdocs build --strict --config-file docs/mkdocs.yml -d site

  build:
    name: Build wheels and sdist
    # Notebooks gate the build, and therefore the release and publish jobs that
    # depend on it. In a teaching library the tutorials are the product: shipping
    # a version whose tutorials do not run is worse than not shipping. This is
    # what makes the check binding rather than advisory.
    needs: [tests, lint, notebooks]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install build tool
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build wheel
        run: |
          python -m build --wheel -o dist

      - name: Build sdist
        run: |
          python -m build --sdist -o dist

      - name: Upload built artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"  # Strip leading 'v'
          cat << EOF > release_body.md
          ## 📦 Installation

          ### Quick Install (Recommended)
          \`\`\`bash
          pip install torchlingo==${VERSION}
          \`\`\`

          ### Google Colab
          \`\`\`python
          %pip install torchlingo==${VERSION}
          \`\`\`

          ## 📚 Resources

          - 📖 [Documentation](https://byu-matrix-lab.github.io/torchlingo/)
          - 🚀 [Quick Start Guide](https://byu-matrix-lab.github.io/torchlingo/getting-started/quickstart/)
          - 📓 [Tutorials](https://byu-matrix-lab.github.io/torchlingo/tutorials/)

          ---
          EOF

          gh release create ${{ github.ref_name }} \
            --title "Release ${{ github.ref_name }}" \
            --notes-file release_body.md \
            --generate-notes \
            dist/*

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          pip install twine

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m twine upload --non-interactive dist/*