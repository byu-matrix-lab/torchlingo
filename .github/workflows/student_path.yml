name: Notebooks as a student runs them

# Runs every notebook the way a Colab student does: a fresh environment per notebook, the
# notebook's own install cell pulling torchlingo from the `course` branch on GitHub,
# google.colab faked, no data/ from the checkout. It found what the per-PR notebook run cannot
# see: tutorials 4 and 7 reading data/ a wheel does not ship, and tutorial 8 needing a
# checkpoint from another runtime.
#
# Not on pull requests: it installs what students are SERVED, the `course` branch, so a PR's
# changes are not what it tests. On every push to `course`, to check what students just got;
# and weekly, to catch drift (a dependency's new release breaking a notebook nobody touched).
# Task #168; `course` since Task #196.

on:
  schedule:
    - cron: "17 9 * * 1"   # Mondays, 09:17 UTC
  push:
    branches: [course]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  student-path:
    name: Notebooks from their own install cells
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The CPU build of torch, as the test job uses: the GPU build is gigabytes, and nothing
      # here has a GPU. pip reads this from the environment, including the notebooks' own
      # %pip install cells, so every fresh environment gets it.
      - name: Run every notebook the student path can supply
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: python scripts/execute_notebooks.py --as-student
