name: Notebooks as a student runs them

# Runs every notebook the way a Colab student does: a fresh environment per notebook, the
# notebook's own install cell pulling torchlingo from PyPI, google.colab faked, no data/ from
# the checkout. It found what the per-PR notebook run cannot see: tutorials 4 and 7 reading
# data/ a wheel does not ship, and tutorial 8 needing a checkpoint from another runtime.
#
# Not on pull requests: it installs what is RELEASED, so a PR's changes are not what it tests.
# Weekly, to catch PyPI drift (a dependency's new release breaking a notebook nobody touched),
# and on every release tag, to check what was just published. Task #168.

on:
  schedule:
    - cron: "17 9 * * 1"   # Mondays, 09:17 UTC
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  student-path:
    name: Notebooks from a PyPI install
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The tag starts this and the publish job at once, and publishing waits for the test
      # matrix. So wait until PyPI serves the tagged version, or this tests the previous one.
      - name: Wait for PyPI to serve the tagged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          for attempt in $(seq 1 60); do
            if curl -fsS "https://pypi.org/pypi/torchlingo/$version/json" > /dev/null; then
              echo "PyPI serves torchlingo $version"; exit 0
            fi
            sleep 60
          done
          echo "torchlingo $version never appeared on PyPI"; exit 1

      # The CPU build of torch, as the test job uses: the GPU build is gigabytes, and nothing
      # here has a GPU. pip reads this from the environment, including the notebooks' own
      # %pip install cells, so every fresh environment gets it.
      - name: Run every notebook the student path can supply
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: python scripts/execute_notebooks.py --as-student
