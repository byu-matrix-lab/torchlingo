name: Notebooks as a student runs them

# Runs every notebook the way a Colab student does: a fresh environment per notebook, the
# notebook's own install cell pulling torchlingo from the `course` branch on GitHub,
# google.colab faked, no data/ from the checkout. It found what the per-PR notebook run cannot
# see: tutorials 4 and 7 reading data/ a wheel does not ship, and tutorial 8 needing a
# checkpoint from another runtime.
#
# Not on pull requests: it installs what students are SERVED, the `course` branch, so a PR's
# changes are not what it tests. On every push to `course`, to check what students just got;
# and weekly, to catch drift (a dependency's new release breaking a notebook nobody touched).
# Task #168; `course` since Task #196. A second job runs every install cell in a copy of
# Colab's environment (Task #244).
#
# One job per notebook (Task #262). Four at a time on one runner, a run took about seven
# minutes, most of it tutorials 6 and 7 sharing four CPUs with two others; a job each, the run
# takes about as long as the slowest notebook alone. Every job's name here starts "Notebooks
# from": promote_course.sh leaves these check runs out by that prefix, and the weekly run puts
# them on main's head, a commit that may then be promoted.

on:
  schedule:
    - cron: "17 9 * * 1"   # Mondays, 09:17 UTC
  push:
    branches: [course]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Which notebooks to run, by the same rules a run on one runner applies: a notebook needing a
  # GPU, a token or a student's answers is skipped, and said so here.
  list:
    name: Notebooks from their own install cells (which to run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      notebooks: ${{ steps.list.outputs.notebooks }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: List the notebooks the student path can supply
        id: list
        run: |
          notebooks="$(python scripts/execute_notebooks.py --as-student --list)"
          echo "$notebooks"
          echo "notebooks=$notebooks" >> "$GITHUB_OUTPUT"

  student-path:
    name: Notebooks from their own install cells (${{ matrix.notebook }})
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # Every notebook reports, not only the first to fail.
      fail-fast: false
      matrix:
        notebook: ${{ fromJSON(needs.list.outputs.notebooks) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pip's download cache, kept between runs; it saves each job's download of torch and the
      # rest. It holds downloaded files only: pip still resolves every version from the
      # index, so what a student would get is unchanged. Keyed by run and restoring the
      # latest, so it always carries the newest wheels; the first job of a run to finish
      # saves it, and the others find the key taken and skip saving.
      - name: Restore pip's download cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: student-path-pip-${{ runner.os }}-${{ github.run_id }}
          restore-keys: student-path-pip-${{ runner.os }}-

      # The CPU build of torch, as the test job uses: the GPU build is gigabytes, and nothing
      # here has a GPU. pip reads this from the environment, including the notebooks' own
      # %pip install cells, so every fresh environment gets it.
      - name: Run ${{ matrix.notebook }} from its own install cell
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: python scripts/execute_notebooks.py --as-student --only "${{ matrix.notebook }}"

  # Every notebook's install cells in a copy of Colab's runtime: its Python and the versions of
  # the packages it ships, as googlecolab/backend-info publishes them, read fresh each run. The
  # job above skips the notebooks that need a GPU or a student's answers -- A10, A11 and A13
  # among them, whose COMET install broke for students in October 2026 -- and builds a plain
  # environment on another Python. The weekly run is how a new Colab image gets caught.
  # Task #244.
  colab-installs:
    name: Notebooks from their own install cells, in Colab's environment
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # student_path.sh --colab gets Colab's Python through uv.
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0

      # As in the job above, and for the same reason: the notebooks' own install cells use pip.
      # uv's cache, for the runner and Colab's pins, is setup-uv's to manage.
      - name: Restore pip's download cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: colab-installs-${{ runner.os }}-${{ github.run_id }}
          restore-keys: colab-installs-${{ runner.os }}-

      - name: Run every notebook's install cells, then its imports
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: python scripts/execute_notebooks.py --as-student --colab --install-only
