# Everything due, in any row of the schedule. The schedule's "Assignment due that day"
# column is built from these, grouped by due date, so a due date is written once.
#   id             A<digits>, at most one lowercase letter; what a notebook's leads_to
#                  names. Deliverables that are not numbered assignments have no id.
#   label          the schedule cell, verbatim.
#   due            must be the date of a schedule row.
#   set_at         the lecture that sets it. Present only for the rows of the table in
#                  "How the second half was scheduled", whose "set at" date is read off
#                  that lecture.
#   emphasize_due  bold the due date in that table.
#   window         that table's window column, verbatim.
#   points         the base total, as on its Learning Suite page and in the course-side
#                  transcript (torchlingo-private/notes/assignments/); a change is written
#                  here first (Eric, Oct 26). Absent where ungraded (A1) or undecided (the
#                  Final Project). Not rendered yet.
#   stretch_points the stretch task's points, about 20% of the base, AI Level 2; absent
#                  where there is none (none on the Final Project, by Eric's ruling).
#   group          its colour in the assignment roadmap chart (`charts`, below): spine, the
#                  student's own system from A4 to A14; eval; llm; early, the ones before
#                  the spine starts. An assignment without one is left out of the chart.
