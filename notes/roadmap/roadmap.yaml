# The "Lecture outcomes" table. Its own list because its rows are not the schedule's:
# Lectures 19 and 20 share a session but have an outcome each, and 21 to 23 share one.
lecture_outcomes:
- lecture: "1"
  topic: Course overview, history
  can: Place Weaver, Georgetown, ALPAC, SMT and NMT in order and say what each promised and
    delivered; state the course's rules on quizzes, late work and AI.
  shown_by: A1, Quiz 1
- lecture: "2"
  topic: Translation challenges
  can: Name the kinds of difficulty (lexical and structural ambiguity, word order, morphology,
    reference, world knowledge) and rank them for their own language with real examples.
  shown_by: A2
- lecture: "3"
  topic: Word embeddings
  can: Explain the distributional idea behind word2vec, GloVe and contextual embeddings; test
    whether a multilingual space lines up for their language pair and read a similarity matrix
    row by row.
  shown_by: A3 heat map and analysis
- lecture: "4"
  topic: Data preparation
  can: Read a TMX file through `repr`, find a planted problem with code rather than by eye,
    write a cleaning step as one function, and say which of the 16 steps fixes which problem.
  shown_by: 'A4: extraction plus three steps'
- lecture: "5"
  topic: Data preparation, part 2
  can: Run a full cleaning pipeline to a sentence-aligned corpus; explain Gale-Church (length
    correlation, link types, the cost model, c and s²) and where length-based alignment fails.
  shown_by: A5, the corpus everything else consumes
- lecture: "6"
  topic: Evaluation
  can: Rank translations by hand before seeing a score; compute BLEU from its parts and explain
    a zero; use chrF; say where a metric and a human disagree and what the metric was rewarding.
  shown_by: A6
- lecture: "7"
  topic: Paper reviews; neural networks
  can: Review a paper to the course template; explain neuron, activation, forward pass, loss
    and gradient; read a loss curve against ln V; tell memorisation from translation with a
    held-out item.
  shown_by: A7 report; paper reviews
- lecture: "8a"
  topic: Encoder-decoder and attention
  can: Describe the encoder-decoder and its bottleneck; explain attention as a learned soft
    alignment and read an alignment matrix; split and verify a corpus and say why the dedupe
    is source-side; read training against validation loss; start, checkpoint and resume a long
    run.
  shown_by: A8
- lecture: "8b"
  topic: The Transformer
  can: Describe self-attention (query, key, value, scaled dot product, softmax) and compute
    one step by hand; say why there are three attentions and what each is for; read a tensor
    shape.
  shown_by: Quiz 8b
- lecture: "8c"
  topic: Finishing the Transformer
  can: Describe multi-head attention, the encoder block and residual stream, and the decoder's
    masked self-attention and cross-attention; say how order gets into a model with no recurrence;
    place their own A8 BLEU on the measured capacity curve and say what capacity buys and when;
    weigh NMT's strengths against its deployment costs.
  shown_by: A8 report back; Quiz 8c
- lecture: "9"
  topic: Morphology, subwords, terminology
  can: Explain the fixed-vocabulary problem and how morphology makes vocabularies explode;
    segment a sentence with BPE by hand; measure `<unk>` before and after SentencePiece; retrain
    with one variable changed and attribute the BLEU difference to it.
  shown_by: A9 comparison
- lecture: "10"
  topic: Quality estimation
  can: Distinguish evaluation from estimation; say what COMET and COMET-QE score and what the
    number means; explain greedy against beam search and why a comparison must pin decoding.
  shown_by: A10; Quiz 10
- lecture: "11"
  topic: Neural QE and toolkits
  can: Run COMET and COMETKiwi on their own A6 data and on their own A8 and A9 test output;
    reconcile them with BLEU, chrF and their human ranking; state what LLM-as-judge scores and
    its system- against segment-level caveat.
  shown_by: A11
- lecture: "12"
  topic: LLMs for MT; context
  can: Prompt a decoder-only model to translate with in-context examples; measure what context
    buys and where it stops; name the document-level problems (pronouns, consistency).
  shown_by: A12 chart and analysis
- lecture: "13"
  topic: Low-resource strategies
  can: Define low-resource beyond pair counts; execute back-translation end to end and measure
    whether it helped.
  shown_by: A13
- lecture: "14"
  topic: Multilingual and zero-shot
  can: Explain tagging and why zero-shot works at all; build a bidirectional system from their
    A9 one and score both directions.
  shown_by: A14
- lecture: "15"
  topic: Speech-to-speech MT
  can: Contrast cascade and end-to-end systems and say what each loses; build an ASR to MT to
    TTS pipeline and say where the errors compound.
  shown_by: A15
- lecture: "16"
  topic: Dubbing and interpretation
  can: Say what dubbing adds to translation (timing, voice, lip sync) and where current systems
    fail.
  shown_by: Quiz 16
- lecture: "17"
  topic: Multimodal NMT
  can: Say when visual context helps translation and how to test the claim.
  shown_by: Quiz 17
- lecture: "18"
  topic: HAMT and MAHT
  can: Measure post-editing with edit distance; explain why post-editing helps some translators
    and not others; describe adaptive MT.
  shown_by: In-class activity; Quiz 18
- lecture: "19"
  topic: Word alignment
  can: Work IBM Model 1 by hand on a toy pair; explain EM; relate statistical alignment to the
    attention alignment of 8a.
  shown_by: Quiz 19
- lecture: "20"
  topic: Previous paradigms
  can: Place RBMT, EBMT and PBSMT on the Vauquois triangle and say what NMT replaced and what
    it kept.
  shown_by: Quiz 20
- lecture: "21 to 23"
  topic: Writing, research, careers
  can: Structure a research article; present a project.
  shown_by: Final project

# One entry per notebook, keyed by file stem.
#   purpose   the notebook index's purpose column. Every other column of the index is
#             read from the notebook's own torchlingo metadata. Required for every
#             notebook, and an entry for a notebook that does not exist is an error.
#   aside, lesson, student_must, notebook_does, rating
#             the "Notebook outcomes, and who does the work" table, in this order; a
#             notebook without a lesson has no row there. aside follows the name.
notebooks:
  lecture-03-word-embeddings:
    purpose: does the shared multilingual space line up across your languages
    lesson: a shared multilingual space can be tested, not assumed
    student_must: pick five words, read the matrix row by row, answer four questions; A3 adds
      the heat-map code, which is deliberately not given
    notebook_does: embed and print the matrix
    rating: low
  lecture-04-regex-refresher:
    purpose: twenty-minute regex tour, ending with re.sub; nine exercises that stop until written
    lesson: read the patterns the cleaning steps are written in
    student_must: write nine patterns, each stopping the notebook until written
    notebook_does: check each against an expected output, refusing a greedy tag pattern and an
      unanchored start
    rating: low
  lecture-04-tmx-cleaning:
    purpose: planted TMX problems, two parsers, a checker that names the cleaning step
    lesson: find data problems with code, through `repr`
    student_must: predict two counts, write the line-break regex, write two cleaners, defend
      a keep-or-drop call
    notebook_does: parse, write files, run the checker
    rating: low. The model for the course
  lecture-05-sentence-alignment:
    purpose: estimate Gale-Church parameters on your language
    lesson: length can align sentences and cannot see a deletion
    student_must: change the priors and watch it fail, upload their A4 files, report c
    notebook_does: aligner, scoring, the c and s² formulas
    rating: low
  lecture-06-mt-evaluation:
    purpose: BLEU's zero on two short sentences; BLEU rebuilt from its parts; your preference
      against BLEU's, on supplied data
    lesson: what BLEU and chrF count
    student_must: write `bleu_from_parts`, record which system they prefer and which BLEU will
      before any score, predict at Parts 1 and 3
    notebook_does: the scoring, and the checks against SacreBLEU's own score
    rating: low
  lecture-06-mt-evaluation-homework:
    purpose: the assignment's scaffold over your uploaded A5 corpus
    lesson: the metrics on their own data
    student_must: upload, sample, paste in ten web MT translations, rank them in `MY_RANKING`
      before any score prints
    notebook_does: three scoring calls, and sentence-level chrF set beside the ranking
    rating: low; A6's substance is MTEval and the analysis
  02-evaluating-translations:
    purpose: the library's out-of-class treatment of evaluation
    aside: (reading)
    lesson: which metric to believe when they disagree
    student_must: decide before scoring; four "Your turn" exercises
    notebook_does: the examples
    rating: low
  lecture-07-toy-model:
    purpose: the three-part toy-model exercise; the student picks the held-out phrase, predicts,
      and a contrast phrase runs; resume demo
    lesson: a model can score perfectly on what it memorised and know nothing
    student_must: choose the held-out phrase, predict, run Parts A and B, report back in class,
      write A7's two sentences; a contrast phrase runs as well
    notebook_does: corpus, model, training, both scorings, the resume demonstration, the report
      printout
    rating: low
  03-train-tiny-model:
    purpose: what a checkpoint holds and what it does not; a rebuild that fails loudly, and one
      that loads cleanly and translates nonsense
    aside: (reading)
    lesson: a saved model is weights without a vocabulary, so the vocabulary must be rebuilt exactly
    student_must: read; run the three rebuilds
    notebook_does: everything
    rating: low, as reading
  lecture-08a-a8-kickoff:
    purpose: from your A5 corpus to a running, checkpointed, bucketed training job
    lesson: from cleaned corpus to a running, checkpointed model
    student_must: type two file names; predict the first logged loss from ln(V), and the curve's
      last epochs; raise `EPOCHS` if validation loss is still falling
    notebook_does: cap, dedupe, split, verification, nine files, the configuration, the training
      call, the resume, the scoring
    rating: '**high**'
  04-attention-and-alignment:
    purpose: with and without attention; did it learn the right alignment; Part 7 is the Transformer
    aside: (reading)
    lesson: attention is measurable alignment
    student_must: read Parts 1 to 5 and 7; run them
    notebook_does: the ablation and the alignment accuracy
    rating: low, as reading
  lecture-08b-cross-attention:
    purpose: one attention step written by the student and shown to be the trained model's, head
      by head; cross-attention read against a wrong translation
    lesson: attention can find the right words and the decoder still write the wrong ones
    student_must: write `attention`, predict where three output pieces will look, say which
      prediction missed
    notebook_does: the model, the capture of each head's inputs and weights, the map
    rating: low
  lecture-08c-attention-heads:
    purpose: the student's head split shown to be the model's in every encoder layer; heads read
      one by one, and sharpness measured against averaging and depth
    lesson: each head is sharp and the average is not; deeper layers spread out
    student_must: write `split_heads` and `sharpness`, predict before the measurement, say which
      part of the prediction was wrong
    notebook_does: the model, the attention step, the capture, the maps
    rating: low
  05-transformer-attention:
    purpose: both of Lecture 8b's and 8c's notebooks in one worked example, without the exercises
    aside: (reference)
  lecture-09-subword-tokenization:
    purpose: '`<unk>` before and after SentencePiece (the student''s counter), a round trip, the
      student''s vocabulary size and A9 prediction; Part B is A9 itself, retrained for as many
      epochs as A8 and scored'
    lesson: a fixed vocabulary cannot say unseen words; subwords can
    student_must: write the `<unk>` counter, pick the vocabulary size with a reason, predict
      A9's BLEU, report back, and reconcile the prediction in the A9 write-up
    notebook_does: the SentencePiece training, the round trip, saving the settings to Drive, and
      in Part B the retraining and both scorings
    rating: low
  06-diagnosing-failures:
    purpose: five questions to ask of a model that is not working
    aside: (reading)
    lesson: a procedure for a model that is not working
    student_must: read once, then look symptoms up
    notebook_does: five planted bugs and their checks
    rating: low; it is a lookup table
  01-data-and-vocab:
    purpose: the library's view of corpus loading, from A5's two files; word-level vocab, stops
      at `<unk>`, which Lecture 9 takes up
    aside: (reference)
    lesson: the library's view of a corpus
    student_must: read
    notebook_does: everything
    rating: low, as reference
  lecture-10-comet-install:
    purpose: install COMET; the student's comet_inputs; two systems scored with and without a
      reference
    lesson: a learned metric, with and without a reference, and the records it scores
    student_must: write comet_inputs (checked on known cases), predict which system each model
      prefers, set up the token
    notebook_does: the install, both models' scoring, the summary A10 grades
    rating: low
  lecture-11-comet-on-a6:
    purpose: COMET and COMETKiwi on the student's A6 sentences, beside BLEU, chrF and their
      ranking, then on their own A8 and A9 systems
    lesson: whether metrics agree with each other and with a human, sentence by sentence
    student_must: reuse comet_inputs, write pairwise_agreement (checked on a known case), predict,
      and explain the agreement in the summary
    notebook_does: loading, all four metrics on every sentence of A6 and of the A8 test set, the
      two reports
    rating: low
  08-inference-and-beamsearch:
    purpose: greedy against beam, written out and checked against the library; why a comparison
      holds decoding fixed, as A9 does
    aside: (reading)
    lesson: decoding is part of the system being measured
    student_must: read
    notebook_does: two decoders written to be read
    rating: low, as reading
  07-real-translations:
    purpose: a trained model on unseen talks; a comparable BLEU; greedy against beam with decoding
      held fixed
    aside: (reading)
    lesson: what an undertrained model looks like on unseen text
    student_must: read; one cell trains a small model
    notebook_does: everything
    rating: low, as reading
  lecture-12-llm-context:
    purpose: in-context translation with 0 to 20 examples, on the student's A12 language
    lesson: in-context examples and what they buy, how many and which
    student_must: write split_pool_and_test and build_prompt (the method, each checked for sizes,
      reproducibility and contamination, and for the prompt's required contents, its wording
      their own); predict the best context size and whether nearest examples beat random ones;
      reconcile the prediction with the curve and its spread over three draws; upload the
      completed notebook
    notebook_does: the LLM, three random draws and the nearest examples at each size, NLLB where
      it covers the language (Telugu), BLEU and chrF, the chart, the rerun record and the upload
      files
    rating: low
  lecture-13-back-translation:
    purpose: back-translation end to end, from the A9 files and the student's own monolingual text
    lesson: synthetic pairs whose target side is real, whether they help, and which way of making
      them helps more; a difference tested, not only measured
    student_must: extract monolingual text from their Church TM's unused segments, topped up from
      public text if short; choose their own reverse model or NLLB as back-translator, which
      back-translates twice, greedily and by sampling (Eric: for time); write reverse and combine (the
      method, checked against known answers and the contamination check); state an "If ...,
      then ..." hypothesis and a prediction before retraining; rank 25 back-translated sentences
      with a partner in MTEval; add Google back-translations to two helped and two hurt
      examples; upload the completed notebook
    notebook_does: the reverse training (none with NLLB), both back-translations, one retraining
      per method, all three systems decoded greedily and with beam 5, BLEU, chrF, the paired
      bootstrap, COMET, the MTEval files and the agreement count, the rerun record and the upload
      files
    rating: low

# The "Tooling the semester depends on" table.
tooling:
- tool: Google Colab, paid plan
  first_needed: Lecture 3
  used_for: every in-class activity and most assignments; the paid plan is required from 8a,
    where A8 needs an A100, L4 or G4 (a T4 does not hold the course model at long lengths)
- tool: Python TMX libraries
  first_needed: Lecture 4
  used_for: extracting segment pairs
- tool: TMX editors (Olifant, Heartsome)
  first_needed: Lecture 4
  used_for: inspection only, never in the pipeline
- tool: grader.exe
  first_needed: Lecture 4
  used_for: checking cleaned output. Students get binaries; the source is one `grader.py` in
    byu-matrix-lab/data-cleaning-pipeline-grader, private and unlicensed; see Open questions
- tool: MTEval (mteval.matrix.byu.edu)
  first_needed: Lecture 6
  used_for: human ranking; students self-register
- tool: SacreBLEU, chrF
  first_needed: Lecture 6
  used_for: automatic scoring, and again in 8, 9, 12, 13, 14
- tool: TorchLingo
  first_needed: Lecture 6
  used_for: 'every model the students train (7, 8, 9, 13, 14), and the metrics and Colab setup in
    every course notebook that uses it. Notebooks install it from the repository''s `course`
    branch, not PyPI, so a notebook and the library code it calls reach students together;
    `setup()` prints the exact version, which is what to ask for with a bug report'
- tool: SentencePiece
  first_needed: Lecture 9
  used_for: subword tokenization
- tool: Hugging Face account and token
  first_needed: Lecture 10
  used_for: COMETKiwi, the reference-free COMET model in A10 and A11, is gated; the reference-based
    COMET model and Lecture 12's default LLM need no token
- tool: COMET / COMET-QE / xCOMET
  first_needed: Lecture 10
  used_for: neural evaluation, and again in 11, 13 and 14
- tool: Azure free tier
  first_needed: Lecture 15
  used_for: ASR, MT and TTS for the speech pipeline

# The document, in order, pieces joined by a blank line:
#   rule            a --- line
#   notice          the generated file's header line
